server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Inline style attributes are used for progress bars. All scripts, including the ONNX runtime,
    # are served from this site ('wasm-unsafe-eval' lets it compile WebAssembly). Speech models
    # are downloaded from Hugging Face; Conversa calls the Claude API. Keep in sync with index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob: data: https://api.anthropic.com https://huggingface.co https://*.huggingface.co https://*.hf.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # Small site with ETags: always revalidate so updates show up on a normal reload.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Data files change often (new resources, published track): always revalidate.
    location /data/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The ONNX runtime loader is an ES module (.mjs); the stock mime.types does not know it,
    # and with nosniff the browser refuses to run it as octet-stream.
    location ~* \.mjs$ {
        default_type application/javascript;
        types { }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
